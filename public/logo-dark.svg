<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="100%" fill="none">
  <!-- Embedded Mark scaled and translated to fit height -->
  <g transform="translate(15, 10) scale(0.3515625)">
    
  <defs>
    <linearGradient id="tealGradDark" x1="180" y1="310" x2="340" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
  </defs>

  <!-- Molar Tooth Silhouette -->
  <path
    d="M152 72
       C102 72 82 122 82 176
       C82 240 98 290 114 344
       C126 384 144 440 172 440
       C194 440 206 398 220 348
       C232 305 244 286 256 286
       C268 286 280 305 292 348
       C306 398 318 440 340 440
       C368 440 386 384 398 344
       C414 290 430 240 430 176
       C430 122 410 72 360 72
       C322 72 292 98 256 122
       C220 98 190 72 152 72 Z"
    fill="#FFFFFF"
  />

  <!-- Subtle crown developmental groove -->
  <path
    d="M165 112 C195 112 226 128 256 150 C286 128 317 112 347 112"
    stroke="#CBD5E1"
    stroke-width="14"
    stroke-linecap="round"
    stroke-opacity="0.2"
  />

  <!-- Precision Checkmark: Knockout Underlay -->
  <path
    d="M182 248 L236 304 L342 168"
    stroke="#0F172A"
    stroke-width="56"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Precision Checkmark: Vibrant Teal Fill -->
  <path
    d="M182 248 L236 304 L342 168"
    stroke="url(#tealGradDark)"
    stroke-width="38"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  </g>

  <!-- Wordmark -->
  <!-- "ADC" in bold authoritative medical navy -->
  <text x="215" y="112" font-family="'Segoe UI', -apple-system, Roboto, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-0.02em" fill="#FFFFFF">ADC</text>
  
  <!-- Subtle vertical divider in clinical teal -->
  <rect x="372" y="62" width="4" height="66" rx="2" fill="#2DD4BF" fill-opacity="0.6" />

  <!-- "Exam Prep" with balanced professional tracking -->
  <text x="396" y="98" font-family="'Segoe UI', -apple-system, Roboto, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.01em" fill="#FFFFFF">Exam Prep</text>
  
  <!-- Sub-caption for clinical precision -->
  <text x="398" y="128" font-family="'Segoe UI', -apple-system, Roboto, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0.14em" fill="#94A3B8">DENTAL PREPARATION</text>
</svg>